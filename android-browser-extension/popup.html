<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Glow</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div class="logo">✦</div><div><h1>YouTube Glow</h1><p>Highlights & Ambient Lights · v2.0</p></div></header>
<p class="hint">Private tools for your current YouTube tab.</p><button data-action="openPanel" class="primary">Open control center / Settings</button>
<div class="grid">
<button data-action="toggle" data-key="lights">✧ Ambient lights</button><button data-action="toggle" data-key="focus">◐ Focus mode</button>
<button data-action="toggle" data-key="hideAdUi">⊘ Hide ad UI</button><button data-action="playPause">▶ / ❚❚ Play / pause</button>
<button data-action="seek" data-seconds="-10">−10 seconds</button><button data-action="seek" data-seconds="10">+10 seconds</button><button data-action="speed" class="wide">↗ Change playback speed</button>
</div><p id="status" role="status">Ready when you're on youtube.com.</p><script src="popup.js"></script></body></html>
